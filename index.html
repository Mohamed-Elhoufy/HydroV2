
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل قياسات الشبكة</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="container">

  <!-- ===== HEADER ===== -->
  <div class="header">
    <h1>📊 تسجيل قياسات الشبكة</h1>
    <p>اختر طريقة تحديد موقع القياس</p>
  </div>

  <!-- ===== MAIN MENU ===== -->
  <div id="main-menu" class="card">
    <button class="option-btn" onclick="showSection('saved')">
      📋 المواقع المحفوظة
    </button>

    <button class="option-btn" onclick="showSection('gps')">
      📍 استخدام الموقع الحالي GPS
    </button>

    <button class="option-btn" onclick="showSection('link')">
      🔗 إدخال رابط Google Maps
    </button>
  </div>

  <!-- ===== GLOBAL ALERT ===== -->
  <div id="global-alert" class="alert"></div>

  <!-- ======================================================= -->
  <!--  SECTION A: SAVED LOCATIONS                             -->
  <!-- ======================================================= -->
  <div id="saved-section" class="section">

    <div class="card">

      <button class="back-btn" onclick="goHome()">
        ← رجوع
      </button>

      <div class="card-title">
        📋 المواقع المحفوظة
      </div>

      <div class="field">
        <label>البحث / الدراسة</label>

        <select
          id="saved-research"
          onchange="onResearchChange('saved')"
        >
          <option value="">جاري التحميل...</option>
        </select>
      </div>

      <!-- Location list — all Visible=TRUE, no search/filter -->

      <div
        id="locations-container"
        class="locations-scroll"
      >
        <div class="loading-state">
          <div class="spinner"></div>
          <p>جاري تحميل المواقع...</p>
        </div>
      </div>

    </div>
  </div>


  <!-- ======================================================= -->
  <!--  SECTION B: GPS                                         -->
  <!-- ======================================================= -->

  <div id="gps-section" class="section">

    <div class="card">

      <button class="back-btn" onclick="goHome()">
        ← رجوع
      </button>

      <div class="card-title">
        📍 الموقع الحالي GPS
      </div>

      <button
        class="btn btn-gps"
        onclick="getCurrentLocation()"
        id="gps-btn"
      >
        📍 تحديد موقعي الحالي
      </button>

      <div
        id="gps-status"
        class="gps-status-box"
        style="margin-top:12px;"
      ></div>


      <!-- Coordinates -->

      <div id="gps-coords" class="coords-box">

        <div class="coords-row">
          <span class="coords-label">LatY:</span>
          <span id="gps-lat">—</span>
        </div>

        <div class="coords-row">
          <span class="coords-label">LongX:</span>
          <span id="gps-lng">—</span>
        </div>

        <div class="coords-row">
          <span class="coords-label">الدقة:</span>
          <span id="gps-acc">—</span>
        </div>

      </div>


      <div id="gps-fields" style="display:none;">

        <div class="field">

          <label>البحث / الدراسة</label>

          <select
            id="gps-research"
            onchange="onResearchChange('gps')"
          >
            <option value="">جاري التحميل...</option>
          </select>

        </div>


        <div class="field">

          <label>
            اسم الموقع
            <span class="req">*</span>
          </label>

          <input
            type="text"
            id="gps-name"
            placeholder="أدخل اسم الموقع"
          />

        </div>


        <div id="gps-alert" class="alert"></div>


        <div class="standalone-actions">

          <button
            class="btn btn-maps"
            onclick="doOpenMaps('gps')"
          >
            🗺️ خرائط
          </button>

          <button
            class="btn btn-pressure"
            onclick="doOpenForm('pressure','gps')"
          >
            📊 ضغط
          </button>

          <button
            class="btn btn-flow"
            onclick="doOpenForm('flow','gps')"
          >
            💧 تصرف
          </button>

        </div>


        <div
          class="standalone-actions"
          style="margin-top:8px;"
        >

          <button
            class="btn btn-save"
            onclick="doSaveLocation('gps')"
          >
            💾 حفظ الموقع في قاعدة البيانات
          </button>

        </div>

      </div>

    </div>
  </div>


  <!-- ======================================================= -->
  <!--  SECTION C: EXTERNAL LINK                               -->
  <!-- ======================================================= -->

  <div id="link-section" class="section">

    <div class="card">

      <button class="back-btn" onclick="goHome()">
        ← رجوع
      </button>

      <div class="card-title">
        🔗 إدخال رابط Google Maps
      </div>


      <div class="field">

        <label>رابط Google Maps</label>

        <div class="link-input-wrapper">

          <input
            type="url"
            id="maps-link-input"
            placeholder="الصق رابط Google Maps هنا..."
            oninput="onLinkInput()"
          />

          <button
            class="link-clear-btn"
            id="link-clear-btn"
            onclick="clearLinkInput()"
          >
            ✕
          </button>

        </div>

      </div>


      <button
        class="btn btn-parse"
        onclick="parseLink()"
      >
        🔍 تحليل الرابط واستخراج الإحداثيات
      </button>


      <!-- Parse result -->

      <div
        id="link-coords"
        class="coords-box"
        style="margin-top:12px;"
      >

        <div class="coords-row">
          <span class="coords-label">LatY:</span>
          <span id="link-lat">—</span>
        </div>

        <div class="coords-row">
          <span class="coords-label">LongX:</span>
          <span id="link-lng">—</span>
        </div>

      </div>


      <div id="link-fields" style="display:none;">

        <div class="field">

          <label>البحث / الدراسة</label>

          <select
            id="link-research"
            onchange="onResearchChange('link')"
          >
            <option value="">جاري التحميل...</option>
          </select>

        </div>


        <div class="field">

          <label>
            اسم الموقع
            <span class="req">*</span>
          </label>

          <input
            type="text"
            id="link-name"
            placeholder="أدخل اسم الموقع"
          />

        </div>


        <div id="link-alert" class="alert"></div>


        <div class="standalone-actions">

          <button
            class="btn btn-maps"
            onclick="doOpenMaps('link')"
          >
            🗺️ خرائط
          </button>

          <button
            class="btn btn-pressure"
            onclick="doOpenForm('pressure','link')"
          >
            📊 ضغط
          </button>

          <button
            class="btn btn-flow"
            onclick="doOpenForm('flow','link')"
          >
            💧 تصرف
          </button>

        </div>


        <div
          class="standalone-actions"
          style="margin-top:8px;"
        >

          <button
            class="btn btn-save"
            onclick="doSaveLocation('link')"
          >
            💾 حفظ الموقع في قاعدة البيانات
          </button>

        </div>

      </div>


      <div
        id="link-parse-alert"
        class="alert"
      ></div>

    </div>
  </div>

</div>
<!-- /container -->


<!-- ===== CONFIRMATION MODAL ===== -->

<div
  id="modal-overlay"
  class="modal-overlay"
>

  <div class="modal-box">

    <div
      class="modal-icon"
      id="modal-icon"
    >
      📊
    </div>

    <h3 id="modal-title">
      تأكيد
    </h3>

    <p id="modal-body">
      هل تريد المتابعة؟
    </p>


    <div class="modal-btns">

      <button
        class="modal-btn modal-btn-yes"
        id="modal-yes"
        onclick="modalConfirm()"
      >
        نعم، متابعة
      </button>

      <button
        class="modal-btn modal-btn-no"
        onclick="closeModal()"
      >
        إلغاء
      </button>

    </div>

  </div>

</div>


<!-- Scripts: config → data → app -->

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>

</body>
</html>
