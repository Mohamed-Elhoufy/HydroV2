  FLOW_FIELDS: {

    researchName: 'entry.651076315',

    locationId:   'entry.533052527',
    locationName: 'entry.1012706378',
    locationLink: 'entry.250696972',

  },

  /* Locations sheet columns */
  LOC_COLS: {
    id:       'Location_ID',
    name:     'Location_Name',
    diameter: 'D',
    material: 'Mat',
    lng:      'Long_X',
    lat:      'Lat_Y',
    mapsLink: 'Location_Link',
    pipeId:   'Pipe_ID',
    visible:  'Visible',
  },

  /* Researchs sheet columns */
  RES_COLS: {
    id:     'Research_ID',
    name:   'Research_Name',
    status: 'Research_Status',
  },

  /* Visible values */
  VISIBLE_VALUES: ['true', 'yes', '1'],

  /* Duplicate tolerance */

  /* GPS */

};


/* ================================================================
   STATE
   ================================================================ */

let _researches   = [];
let _locations    = [];
let _filteredLocs = [];

let _savedSelected = null;

let _gpsData  = null;
let _linkData = null;

let _pendingAction = null;


/* ================================================================
   INIT
   ================================================================ */

(async function init() {
  await Promise.all([
    loadResearches(),
    loadLocations(),
  ]);
})();


/* ================================================================
   SECTION NAVIGATION
   ================================================================ */

function showSection(name) {
  document.getElementById('main-menu').style.display = 'none';

  document.querySelectorAll('.section')
    .forEach(s => s.classList.remove('active'));

  document.getElementById(name + '-section')
    .classList.add('active');
}


function goHome() {
  document.querySelectorAll('.section')
    .forEach(s => s.classList.remove('active'));

  document.getElementById('main-menu').style.display = 'block';

  clearGlobalAlert();
}


/* ================================================================
   CSV PARSING
   ================================================================ */

function parseCSV(text) {

  const lines = text.trim().split(/\r?\n/);

  if (lines.length < 2) return [];

  const headers = parseCsvLine(lines[0]);

  return lines.slice(1).map(line => {

    const vals = parseCsvLine(line);
    const obj = {};

    headers.forEach((h, i) => {
      obj[h.trim()] = (vals[i] || '').trim();
    });

    return obj;

  }).filter(row =>
    Object.values(row).some(v => v)
  );
}


function parseCsvLine(line) {

  const result = [];

  let current = '';
  let inQuotes = false;

  for (let i = 0; i < line.length; i++) {

    const ch = line[i];

    if (ch === '"') {

      if (inQuotes && line[i + 1] === '"') {
        current += '"';
        i++;
      } else {
        inQuotes = !inQuotes;
      }

    } else if (ch === ',' && !inQuotes) {

      result.push(current);
      current = '';

    } else {

      current += ch;
    }
  }

  result.push(current);

  return result;
}

async function loadResearches() {

  try {

      throw new Error('HTTP ' + r.status);
    }

    const rows = parseCSV(await r.text());

    const idCol     = CONFIG.RES_COLS.id;
    const nameCol   = CONFIG.RES_COLS.name;
    const statusCol = CONFIG.RES_COLS.status;

    _researches = rows
      .map(row => ({
        id:     row[idCol] || '',

        status: row[statusCol] || '',
      }))

    _researches = [];

   ================================================================ */

function getSelectedResearch(mode) {

  const el = document.getElementById(mode + '-research');

  if (!el) {
    return {
      id: '',
      name: CONFIG.FREE_MEASUREMENT_LABEL
    };
  }

  const selectedId = el.value;

  /* Free measurement */
  if (!selectedId) {
    return {
      id: '',
      name: CONFIG.FREE_MEASUREMENT_LABEL
    };
  }

  const research = _researches.find(
    r => r.id === selectedId
  );

  if (research) {

      name: research.name
    };
  }

  return {
    id: selectedId,
    name: el.options[el.selectedIndex]?.text || ''
  };
}

   ================================================================ */

async function getCurrentLocation() {

  const statusEl =
    document.getElementById('gps-status');

  const coordsEl =
    document.getElementById('gps-coords');

  const fieldsEl =
    document.getElementById('gps-fields');

  setGpsStatus(
    'locating',
    '⏳ جاري تحديد الموقع...'
  );

  coordsEl.classList.remove('visible');
  fieldsEl.style.display = 'none';

  _gpsData = null;

  if (!navigator.geolocation) {

    setGpsStatus(
      'error',
      '❌ المتصفح لا يدعم تحديد الموقع الجغرافي'
    );

    return;
  }

  try {

    const pos = await new Promise(
      (resolve, reject) =>
        navigator.geolocation.getCurrentPosition(
          resolve,
          reject,
          {
            enableHighAccuracy: true,
            timeout: CONFIG.GPS_TIMEOUT_MS,
            maximumAge: CONFIG.GPS_MAX_AGE_MS,
          }
        )
    );

    const lat =
      pos.coords.latitude;

    const lng =
      pos.coords.longitude;

    const acc =
      pos.coords.accuracy;

    const mapsLink =
      buildGoogleMapsUrl(lat, lng);

    _gpsData = {
      lat,
      lng,
      accuracy: acc,
      mapsLink,
      savedLocId: null
    };

    document.getElementById('gps-lat')
      .textContent = lat.toFixed(6);

    document.getElementById('gps-lng')
      .textContent = lng.toFixed(6);

    document.getElementById('gps-acc')
      .textContent = acc.toFixed(1) + ' م';

    coordsEl.classList.add('visible');

    fieldsEl.style.display = 'block';

    if (acc > CONFIG.GPS_ACCURACY_WARN) {

      setGpsStatus(
        'warn',
        `⚠️ دقة GPS ضعيفة (${acc.toFixed(0)} م). حاول الانتقال لمنطقة مكشوفة.`
      );

    } else {

      setGpsStatus(
        'success',
        `✅ تم تحديد الموقع بنجاح — دقة ${acc.toFixed(0)} م`
      );
    }

  } catch (err) {

    const msgs = {
      1: '❌ تم رفض إذن الوصول للموقع. يرجى السماح للمتصفح بتحديد الموقع.',
      2: '❌ الموقع الجغرافي غير متاح حالياً.',
      3: '❌ انتهت مهلة تحديد الموقع. حاول مرة أخرى.',
    };

    setGpsStatus(
      'error',
      msgs[err.code] || '❌ فشل تحديد الموقع.'
    );
  }
}

/* ================================================================
   GOOGLE MAPS LINK PARSER
   ================================================================ */

function parseGoogleMapsUrl(url) {

  if (!url) return null;

  url = url.trim();

  let m =
    url.match(
      /[?&]q=(-?\d+\.?\d*)[,%2C]+(-?\d+\.?\d*)/i
    );

  if (m) {
    return {
      lat: parseFloat(m[1]),
      lng: parseFloat(m[2])
    };
  }

  m =
    url.match(
      /@(-?\d+\.?\d*),(-?\d+\.?\d*),/
    );

  if (m) {
    return {
      lat: parseFloat(m[1]),
      lng: parseFloat(m[2])
    };
  }

  m =
    url.match(
      /\/(-?\d+\.?\d*),(-?\d+\.?\d*)/
    );

  if (m) {
    return {
      lat: parseFloat(m[1]),
      lng: parseFloat(m[2])
    };
  }

  m =
    url.match(
      /ll=(-?\d+\.?\d*),(-?\d+\.?\d*)/i
    );

  if (m) {
    return {
      lat: parseFloat(m[1]),
      lng: parseFloat(m[2])
    };
  }

  m =
    url.match(
      /destination=(-?\d+\.?\d*),(-?\d+\.?\d*)/i
    );

  if (m) {
    return {
      lat: parseFloat(m[1]),
      lng: parseFloat(m[2])
    };
  }

  return null;
}

async function parseLink() {

  const url =
    document.getElementById(
      'maps-link-input'
    ).value.trim();

  if (!url) {

    showAlert(
      'link-parse-alert',
      'warn',
      '⚠️ الرجاء لصق رابط Google Maps أولاً'
    );

    return;
  }

  const coords =
    parseGoogleMapsUrl(url);

  if (!coords) {

    showAlert(
      'link-parse-alert',
      'error',
      '❌ تعذّر استخراج الإحداثيات من هذا الرابط. تأكد أنه رابط Google Maps صحيح.'
    );

    return;
  }

  const { lat, lng } = coords;

  if (
    lat < -90 ||
    lat > 90 ||
    lng < -180 ||
    lng > 180
  ) {

    showAlert(
      'link-parse-alert',
      'error',
      '❌ الإحداثيات المستخرجة غير صالحة.'
    );

    return;
  }

  const mapsLink =
    buildGoogleMapsUrl(lat, lng);

  _linkData = {
    lat,
    lng,
    mapsLink,
    savedLocId: null
  };

  document.getElementById('link-lat')
    .textContent = lat.toFixed(6);

  document.getElementById('link-lng')
    .textContent = lng.toFixed(6);

  document
    .getElementById('link-coords')
    .classList.add('visible');

  document
    .getElementById('link-fields')
    .style.display = 'block';

  hideAlert('link-parse-alert');

  showAlert(
    'link-parse-alert',
    'success',
    `✅ تم استخراج الإحداثيات: ${lat.toFixed(6)}, ${lng.toFixed(6)}`
  );
}

/* ================================================================
   BUILD PREFILLED FORM URL
   Research + Location
   ================================================================ */

function buildPrefilledFormUrl(
  type,
  researchId,
  researchName,
  locationId,
  locationName,
  locationLink,
  longX,
  latY
) {

  const isPressure =
    type === 'pressure';

  const base =
    isPressure
      ? CONFIG.PRESSURE_FORM_URL
      : CONFIG.FLOW_FORM_URL;

  const fields =
    isPressure
      ? CONFIG.PRESSURE_FIELDS
      : CONFIG.FLOW_FIELDS;

  const params =
    new URLSearchParams();

  /* Research */
  if (fields.researchId && researchId) {
    params.set(
      fields.researchId,
      researchId
    );
  }

  if (fields.researchName && researchName) {
    params.set(
      fields.researchName,
      researchName
    );
  }

  /* Location */
  if (fields.locationId && locationId) {
    params.set(
      fields.locationId,
      locationId
    );
  }

  if (fields.locationName && locationName) {
    params.set(
      fields.locationName,
      locationName
    );
  }

  if (fields.locationLink && locationLink) {
    params.set(
      fields.locationLink,
      locationLink
    );
  }

  /* Coordinates */
  if (fields.longX && longX !== '') {
    params.set(
      fields.longX,
      longX
    );
  }

  if (fields.latY && latY !== '') {
    params.set(
      fields.latY,
      latY
    );
  }

  return `${base}?${params.toString()}`;
}

async function doSaveLocation(mode) {

  if (mode === 'gps') {

    if (!_gpsData) {

      );

      return;
    }

    ({
      lat,
      lng,
      mapsLink
    } = _gpsData);

    hideAlert('gps-alert');

  } else {

    if (!_linkData) {

      showAlert(
        'link-alert',
        'error',
        '⚠️ يجب تحليل الرابط أولاً'
      );

      return;

        'link-name'
      ).value.trim();

      showAlert(
        'link-alert',
        'error',
        '⚠️ الرجاء إدخال اسم الموقع'
      );

      return;
    }

    ({
      lat,
      lng,
      mapsLink
    } = _linkData);

    hideAlert('link-alert');
  }

  const alertId =
    mode + '-alert';


  /* ============================================================
     CLIENT-SIDE DUPLICATE CHECK
     ============================================================ */

  const dup =
    checkDuplicateLocation(
      lat,
      lng
    );

  if (dup) {

    const c =
      CONFIG.LOC_COLS;

    showAlert(
      alertId,
      'warn',
      `⚠️ يوجد موقع مشابه بالفعل: "${escHtml(dup[c.name])}" ` +
      `[${escHtml(dup[c.id])}] على بُعد أقل من ` +
      `${CONFIG.DUPLICATE_TOLERANCE_METERS}م. لم يتم الحفظ.`
    );

    return;
  }


  /* ============================================================
     PAYLOAD
     Backend generates Location_ID
     ============================================================ */

  const c =
    CONFIG.LOC_COLS;

  const payload = {

    [c.name]: name,

    [c.lat]: lat,

    [c.lng]: lng,

    [c.mapsLink]: mapsLink,

    [c.visible]: 'TRUE'
  };


  showAlert(
    alertId,
    'info',
    '⏳ جاري حفظ الموقع...'
  );


  try {

    /*
      IMPORTANT:
      Do NOT set Content-Type: application/json here.

      Apps Script Web App can receive the raw body
      without triggering browser CORS preflight.
    */

    const r =
      await fetch(
        CONFIG.LOCATION_WRITE_API_URL,
        {
          method: 'POST',
          body: JSON.stringify(payload)
        }
      );

    const json =
      await r.json();


    if (json.status === 'success') {

      const generatedId =
        json.locationId || '';


      /* Store returned Location_ID */
      if (mode === 'gps') {
        _gpsData.savedLocId =
          generatedId;
      }

      if (mode === 'link') {
        _linkData.savedLocId =
          generatedId;
      }


      /* Add new location locally */
      const localEntry = {
        ...payload,
        [c.id]: generatedId
      };

      _locations.push(localEntry);

      _filteredLocs =
        [..._locations];


      showAlert(
        alertId,
        'success',
        `✅ تم حفظ الموقع "${escHtml(name)}" ` +
        `[${escHtml(generatedId)}] بنجاح`
      );


    } else if (
      json.status === 'duplicate'
    ) {

      /*
        Backend found duplicate.
        Use returned Location_ID if available.
      */

      if (json.locationId) {

        if (mode === 'gps') {
          _gpsData.savedLocId =
            json.locationId;
        }

        if (mode === 'link') {
          _linkData.savedLocId =
            json.locationId;
        }
      }

      showAlert(
        alertId,
        'warn',
        `⚠️ ${json.message || 'الموقع موجود بالفعل.'}`
      );


    } else {

      throw new Error(
        json.message ||
        'Unknown error'
      );
    }


  } catch (e) {

    showAlert(
      alertId,
      'error',
      `❌ فشل حفظ الموقع: ${escHtml(e.message)}`
    );
  }
}


/* ================================================================
   DUPLICATE DETECTION
   ================================================================ */

function checkDuplicateLocation(lat, lng) {

  const tol =
    CONFIG.DUPLICATE_TOLERANCE_METERS;

  const c =
    CONFIG.LOC_COLS;

  return _locations.find(loc => {

    const rowLat =
      parseFloat(loc[c.lat]);

    const rowLng =
      parseFloat(loc[c.lng]);

    if (
      isNaN(rowLat) ||
      isNaN(rowLng)
    ) {
      return false;
    }

    return haversineMeters(
      lat,
      lng,
      rowLat,
      rowLng
    ) < tol;

  }) || null;
}


function haversineMeters(
  lat1,
  lng1,
  lat2,
  lng2
) {

  const R = 6371000;

  const φ1 =
    lat1 * Math.PI / 180;

  const φ2 =
    lat2 * Math.PI / 180;

  const Δφ =
    (lat2 - lat1) * Math.PI / 180;

  const Δλ =
    (lng2 - lng1) * Math.PI / 180;

  const a =
    Math.sin(Δφ / 2) ** 2 +
    Math.cos(φ1) *
    Math.cos(φ2) *
    Math.sin(Δλ / 2) ** 2;

  return R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );
}

function openModal() {

  document
    .getElementById('modal-overlay')
    .classList.add('active');
}


function closeModal() {

  document
    .getElementById('modal-overlay')
    .classList.remove('active');

  _pendingAction = null;
}


function modalConfirm() {

  const action =
    _pendingAction;

  closeModal();

  if (action) {
    action();
  }
}


document
  .getElementById('modal-overlay')
  .addEventListener(
    'click',
    function(e) {

      if (e.target === this) {
        closeModal();
      }
    }
  );


/* ================================================================
   ALERTS
   ================================================================ */

function showAlert(
  elId,
  type,
  msg
) {

  const el =
    document.getElementById(elId);

  if (!el) return;

  el.className =
    `alert alert-${type} visible`;

  el.innerHTML = msg;
}


function hideAlert(elId) {

  const el =
    document.getElementById(elId);

  if (el) {
    el.classList.remove('visible');
  }
}


function showGlobalAlert(
  type,
  msg
) {

  const el =
    document.getElementById(
      'global-alert'
    );

  el.className =
    `alert alert-${type} visible`;

  el.innerHTML = msg;
}


function clearGlobalAlert() {

  document
    .getElementById('global-alert')
    .classList.remove('visible');
}


/* ================================================================
   UTILITIES
   ================================================================ */

function escHtml(str) {

  if (!str) return '';

  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
